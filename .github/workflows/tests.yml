# Byte-compiles the package (warnings are errors) and runs its ERT tests on
# every push and pull request: on Linux, with Flycheck, jing and trang, so
# that no test is skipped, and on Windows, without jing and trang (their
# tests skip themselves); also on macOS for release tags, the Monday run and
# runs started by hand (GitHub often has no Mac free, and then cancels the
# job after a long wait, which fails the whole run for nothing).

name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Mondays: catches what changes upstream with no push here (the TEI
    # Stylesheets' dev branch, new saxonche or lxml, Emacs, Flycheck, npm)
    - cron: "20 6 * * 1"

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) && '["ubuntu-latest", "macos-latest", "windows-latest"]' || '["ubuntu-latest", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Emacs (Linux, macOS)
        if: runner.os != 'Windows'
        uses: purcell/setup-emacs@v8.0
        with:
          version: "31.1"

      - name: Emacs (Windows)
        if: runner.os == 'Windows'
        uses: jcs090218/setup-emacs-windows@master
        with:
          version: "31.1"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.15"

      - name: Install saxonche, lxml and Flycheck
        run: |
          python -m pip install saxonche lxml
          git clone -q --depth 1 https://github.com/flycheck/flycheck.git "$RUNNER_TEMP/flycheck"

      - name: Install jing and trang (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q jing trang
          echo "JING=/usr/bin/jing" >> "$GITHUB_ENV"
          echo "PYSCH_TRANG=/usr/bin/trang" >> "$GITHUB_ENV"

      - name: Install jing and trang (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install jing-trang
          echo "JING=$(command -v jing)" >> "$GITHUB_ENV"
          echo "PYSCH_TRANG=$(command -v trang)" >> "$GITHUB_ENV"

      - name: Byte-compile
        run: |
          emacs --batch -Q -L . --eval '(setq byte-compile-error-on-warn t)' \
            -f batch-byte-compile py-schematron.el
          rm -f py-schematron.elc

      - name: Test
        run: |
          export FLYCHECK_DIR="$RUNNER_TEMP/flycheck"
          # (the Python's own path, which a Windows Emacs understands too)
          export PYSCH_PYTHON="$(python -c 'import sys; print(sys.executable)')"
          emacs --batch -Q -L . -l test/py-schematron-tests.el -f ert-run-tests-batch-and-exit
